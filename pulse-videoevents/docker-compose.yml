services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulse_videoevents
      POSTGRES_USER: pulse_videoevents_app
      POSTGRES_PASSWORD: changeit
    ports: [ "5432:5432" ]
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U pulse_videoevents_app -d pulse_videoevents" ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: [ "9092:9092" ]
    healthcheck:
      test: [ "CMD-SHELL","kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: [ "8085:8080" ]
    depends_on: [ kafka ]

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
      kafka: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/pulse_videoevents
      DB_USERNAME: pulse_videoevents_app
      DB_PASSWORD: changeit
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      OUTBOX_RELAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-change-this-secret-change-this-secret}
    ports: [ "8080:8080" ]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [ "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" ]
    ports: [ "9090:9090" ]

  grafana:
    image: grafana/grafana:11.2.0
    environment: { GF_SECURITY_ADMIN_PASSWORD: admin }
    ports: [ "3000:3000" ]
    depends_on: [ prometheus ]

volumes: { pgdata: { } }
